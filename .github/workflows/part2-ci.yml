name: RaceDay Part 2 CI
on:
  push:
    branches: [ "main", "master", "part2" ]
  pull_request:
    branches: [ "main", "master", "part2" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore RaceDay.sln
      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --logger "console;verbosity=normal"
